disallowed-types = [
    { path = "std::collections::HashMap", reason = "nondeterministic order; use indexmap or BTreeMap" },
    { path = "std::collections::HashSet", reason = "nondeterministic order; use indexmap or BTreeSet" },
    { path = "std::time::Instant", reason = "use kos time (virtual clock)" },
    { path = "std::time::SystemTime", reason = "use kos time (virtual clock)" },
    { path = "std::sync::Mutex", reason = "use kos sync" },
    { path = "std::sync::RwLock", reason = "use kos sync" },
    { path = "std::sync::Condvar", reason = "use kos sync" },
    { path = "std::sync::Barrier", reason = "use kos sync" },
]
