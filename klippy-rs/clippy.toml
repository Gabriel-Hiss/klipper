    { path = "std::thread::spawn", reason = "use kos thread" },
    { path = "std::thread::sleep", reason = "use kos time" },
    { path = "std::thread::park", reason = "use kos sync" },
    { path = "std::sync::mpsc::channel", reason = "use kos sync" },
    { path = "std::sync::mpsc::sync_channel", reason = "use kos sync" },
    { path = "f64::mul_add", reason = "no fused multiply-add" },
